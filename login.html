<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta name="theme-color" content="#0b1020">

    <link
        rel="manifest"
        href="manifest.json"
    >

    <link
        rel="stylesheet"
        href="css/login.css"
    >

    <title>E-Glasses Login</title>
</head>

<body>

<div class="login-wrapper">

    <div class="login-card">

        <div class="brand">
            <img
                src="assets/logo.png"
                alt="E-Glasses"
            >

            <h1>E-Glasses</h1>

            <p>
                Customer Management System
            </p>
        </div>

        <form id="loginForm">

            <div class="input-group">
                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    required
                    autocomplete="username"
                >
            </div>

            <div class="input-group">
                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    required
                    autocomplete="current-password"
                >
            </div>

            <button
                type="submit"
                class="primary-btn"
            >
                Sign In
            </button>

        </form>

        <p id="loginError"></p>

        <a href="privacy.html">
            Privacy Policy
        </a>

    </div>

</div>

<script type="module" src="js/auth.js"></script>

</body>
</html>
